name: probe-models
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: which models answer
        env:
          KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          for M in glm-4.5-flash glm-4.5-flashx glm-4.5-air glm-4.5 glm-4.6 glm-4.7; do
            CODE=$(curl -sS -o /tmp/r -w "%{http_code}" https://api.z.ai/api/paas/v4/chat/completions \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"say alive\"}],\"max_tokens\":16}")
            echo "== $M -> HTTP $CODE : $(head -c 220 /tmp/r)"
          done
