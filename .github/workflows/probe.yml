name: probe-models
on:
  workflow_dispatch:
permissions:
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAYLOAD='{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"say alive"}],"max_tokens":20}'
          echo "== A: /inference/chat/completions =="
          curl -sS -D /tmp/hA -o /tmp/bA -w "HTTP %{http_code}\n" https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$PAYLOAD"
          grep -iE "^(HTTP|content-type|location|x-" /tmp/hA | head -8
          echo "-- body ($(wc -c < /tmp/bA) bytes):"; head -c 500 /tmp/bA; echo
          echo "== B: /chat/completions =="
          curl -sS -o /tmp/bB -w "HTTP %{http_code}\n" https://models.github.ai/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$PAYLOAD"
          head -c 300 /tmp/bB; echo
