name: heartbeat

# The creature's pulse. One waking per hour — always midnight somewhere.
# External events are stimuli (voices, touches), never self-triggered:
# pushes by the creature do NOT wake it (GITHUB_TOKEN pushes don't retrigger).

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  star:
    types: [created]
  fork:

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: wake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_MODEL: ${{ vars.MODELS_MODEL }}
        run: python3 sleep/wake.py
